# Static file server for the SPA. Intentionally contains no proxy_pass:
# Coolify routes /api and /mcp to the backend; this server only serves assets
# and falls back to index.html for client-side routes.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived caching for fingerprinted assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
