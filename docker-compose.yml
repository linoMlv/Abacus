# Abacus deployment: a single application container (FastAPI serves both the
# API and the built frontend) plus PostgreSQL. Coolify only needs to point the
# domain at the "app" service on port 8000 — no path-based routing required.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abacus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abacus}
      POSTGRES_DB: ${POSTGRES_DB:-abacus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abacus} -d ${POSTGRES_DB:-abacus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # The app builds DATABASE_URL from these components (URL.create), which
      # safely encodes special characters in the password.
      POSTGRES_USER: ${POSTGRES_USER:-abacus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abacus}
      POSTGRES_DB: ${POSTGRES_DB:-abacus}
      DB_HOST: db
      DB_PORT: "5432"
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-5/minute}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
      SQL_ECHO: ${SQL_ECHO:-false}
      LOGS_USER: ${LOGS_USER}
      LOGS_PASS: ${LOGS_PASS}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: ${APP_URL:-}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
