name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: abacus
          POSTGRES_PASSWORD: abacus
          POSTGRES_DB: abacus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abacus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Run the suite on PostgreSQL (FK enforced, Decimal/datetime parity).
      TEST_DATABASE_URL: postgresql+psycopg://abacus:abacus@localhost:5432/abacus_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        run: pytest

  migrations:
    name: Migrations (build schema from scratch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: abacus
          POSTGRES_PASSWORD: abacus
          POSTGRES_DB: abacus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abacus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://abacus:abacus@localhost:5432/abacus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The migration chain must build the schema from empty and tear it down
      # cleanly — guards against model/migration drift.
      - name: alembic upgrade head
        run: alembic upgrade head

      - name: alembic downgrade base
        run: alembic downgrade base

  frontend:
    name: Frontend (lint + build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npx vitest run
