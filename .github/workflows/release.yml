name: Release

# Build the production image (front + back), validate it on every PR, and
# publish it to GitHub Container Registry (GHCR) on pushes to main and on
# version tags. An optional Coolify webhook is triggered after a main push.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No registry credentials are needed (or available, for fork PRs) to just
      # validate the build, so only log in when we actually publish.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name (GHCR requires it).
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Build everywhere (validates the Dockerfile on PRs); push only when
          # not a PR.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Coolify deploy
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No-op unless COOLIFY_WEBHOOK is configured in repo secrets, so the
      # pipeline is wired but never fails for forks/contributors without it.
      - name: Call Coolify deploy webhook (if configured)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "${COOLIFY_WEBHOOK}" ]; then
            echo "COOLIFY_WEBHOOK secret not set — skipping deploy trigger."
            exit 0
          fi
          curl -fsSL -X POST "${COOLIFY_WEBHOOK}" \
            ${COOLIFY_TOKEN:+-H "Authorization: Bearer ${COOLIFY_TOKEN}"}
          echo "Coolify deploy triggered."
