version: 2
updates:
  # Backend Python dependencies (requirements*.txt).
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    # Wait 7 days before proposing a newly published version (supply-chain safety).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)

  # Frontend npm dependencies.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Wait 7 days before proposing a newly published version (supply-chain safety).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days before proposing a newly published version (supply-chain safety).
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(ci)

  # Base images referenced by the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days before proposing a newly published version (supply-chain safety).
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(ci)
