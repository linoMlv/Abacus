[config]
app_name = "abacus"
app_port = 9874
host = "127.0.0.1"
backend_folder = "backend"
frontend_folder = "frontend"

[git]
repo_url = "https://github.com/linoMlv/Abacus.git"
branch = "main"

[system]
autostart = true
restart_on_crash = true

[environment]
python_version = ">=3.11"
node_version = ">=20.0"

[backend]
entrypoint = "main:app"
migrations_dir = "alembic"
api_prefix = "/api"

[frontend]
build_command = "npm run build"
dist_folder = "dist"
assets_prefix = "/assets"
