# Local testing override — NOT used in production.
# Publishes the app port on the host so you can reach it from your machine.
# It is only applied when passed explicitly with -f, so a plain
# `docker compose up` (e.g. on Coolify) ignores it.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Or simply run ./scripts/run-local.sh
services:
  app:
    ports:
      - "8000:8000"
  # Uncomment to inspect PostgreSQL from the host (e.g. with psql/DBeaver):
  # db:
  #   ports:
  #     - "5432:5432"
