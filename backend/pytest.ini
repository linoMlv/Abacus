[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v
# Keep the suite output signal-clean (B13): ignore a third-party deprecation we
# don't control and can't act on yet — Starlette's TestClient warns about httpx
# (httpx2 is not a stable option). Our own code raises no DeprecationWarnings.
filterwarnings =
    ignore::starlette.exceptions.StarletteDeprecationWarning
